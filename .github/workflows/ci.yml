name: CI

# Safety net for every push and pull request: install, lint, run the unit/
# component test suite, and do a production build. Doesn't deploy anything
# and doesn't need any secrets — see deploy.yml for that.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint-test-build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
